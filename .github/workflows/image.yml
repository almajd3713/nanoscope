name: image

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Each variant builds from its own Dockerfile. The runner has no GPU, so the CUDA image is
    # checked for building, starting and importing torch; `POST /api/bench` on a GPU is by hand.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # the CUDA base image is several GB
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - run: docker build -f docker/Dockerfile.${{ matrix.variant }} -t nanoscope:${{ matrix.variant }} .
      - name: Smoke test
        run: |
          image=nanoscope:${{ matrix.variant }}
          docker run --rm $image nanoscope presets
          test "$(docker run --rm $image id -u)" = 1000
          docker run --rm $image python -c "import torch; print('torch', torch.__version__)"
          docker image ls nanoscope --format '{{.Tag}} image size: {{.Size}}'
      - name: Health check
        run: |
          docker run -d --name ns nanoscope:${{ matrix.variant }}
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' ns)
            [ "$s" = healthy ] && exit 0
            sleep 2
          done
          docker logs ns
          exit 1

  push:
    # only on a tag; PRs build and test but never push
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/almajd3713/nanoscope
          flavor: latest=false
          # a release candidate gets its versioned tag only: it must not move `cpu` or `cuda`
          tags: |
            type=raw,value=${{ matrix.variant }},enable=${{ !contains(github.ref_name, 'rc') }}
            type=raw,value=${{ matrix.variant }}-{{version}}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=See what your language model learns (${{ matrix.variant }})
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.variant }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
