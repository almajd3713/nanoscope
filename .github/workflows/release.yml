name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # dry run: builds and tests the wheel, publishes nothing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install the wheel in a clean venv and smoke test it
        run: |
          uv venv /tmp/venv
          uv pip install --python /tmp/venv/bin/python "$(ls dist/*.whl)[server]"
          /tmp/venv/bin/nanoscope presets
          /tmp/venv/bin/python -c "import nanoscope; print(nanoscope.__version__)"

  publish-testpypi:
    # rc tags (v0.3.0rc1) go to TestPyPI
    if: github.event_name == 'push' && contains(github.ref_name, 'rc')
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'push' && !contains(github.ref_name, 'rc')
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
