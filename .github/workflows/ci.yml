name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: make lint
      - run: make typecheck
      - run: make test

  curricula:
    # Every lesson's starter fails and its reference solution passes, offline, on CPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: make test-curricula

  server:
    # The HTTP API end to end (real sockets, real jobs) and its OpenAPI document.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - run: uv run pytest tests/server -v
      - run: make openapi && git diff --exit-code docs/openapi.json

  web:
    # The GUI: lint, types, unit tests and the production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens --check
      - run: pnpm api && git diff --exit-code src/api
      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    # The GUI against a real compose stack: the plan's done-when checks, in a browser.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: web/e2e/stack.sh up
      - run: pnpm e2e
        working-directory: web
      - name: Keep the traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: web/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p nanoscope-e2e -f compose.yaml logs --tail 80
      - run: web/e2e/stack.sh down
        if: always()

  first-notebook:
    # Guards level 0: the first notebook stays at 3 cells and trains on CPU in under 2 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.nanoscope/data
          key: tokens-tinystories-5min-bpe4096-v1
      - run: uv run pytest tests/test_first_model_notebook.py -v
      # lesson F01 trains the solution on real data too, and must stay under 2 minutes
      - run: uv run pytest tests/test_curricula.py -k f01 -v

  compose:
    # The docker compose stack end to end: build the image, bring up the API and a worker,
    # run a bigram over the API. The token cache seeds the data volume; a miss is filled by the
    # worker's own prepare-data (the network is allowed there, not in the timed part).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - uses: actions/cache@v4
        with:
          path: ~/.nanoscope/data
          key: tokens-tinystories-5min-bpe4096-v1
      - run: uv run pytest -m compose tests/compose -v
