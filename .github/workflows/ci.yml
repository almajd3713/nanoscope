name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: make lint
      - run: make typecheck
      - run: make test

  first-notebook:
    # Guards level 0: the first notebook stays at 3 cells and trains on CPU in under 2 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.nanoscope/data
          key: tokens-tinystories-5min-bpe4096-v1
      - run: uv run pytest tests/test_first_model_notebook.py -v
