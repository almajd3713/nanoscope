name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      - run: make lint
      - run: make typecheck
      - run: make test

  curricula:
    # Every lesson's starter fails and its reference solution passes, offline, on CPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: make test-curricula

  server:
    # The HTTP API end to end (real sockets, real jobs) and its OpenAPI document.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra server --extra dev
      - run: uv run pytest tests/server -v
      - run: make openapi && git diff --exit-code docs/openapi.json

  first-notebook:
    # Guards level 0: the first notebook stays at 3 cells and trains on CPU in under 2 minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - uses: actions/cache@v4
        with:
          path: ~/.nanoscope/data
          key: tokens-tinystories-5min-bpe4096-v1
      - run: uv run pytest tests/test_first_model_notebook.py -v
      # lesson F01 trains the solution on real data too, and must stay under 2 minutes
      - run: uv run pytest tests/test_curricula.py -k f01 -v
