[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nanoscope-lab"
version = "0.2.0"
description = "See what your language model learns"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=3.0,<5",
  "huggingface-hub>=0.27,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "tiktoken>=0.8,<1",
  "tokenizers>=0.20,<1",
  "tomli>=2 ; python_full_version < '3.11'",
  "tomli-w>=1.0",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19,<1"]
graph = ["libcst>=1.1,<2"]  # emit graph edits back into source; later part of `server`
dev = [
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pyright>=1.1.390",
  "ruff>=0.9,<1",
  "jsonschema>=4.20,<5",
  "libcst>=1.1,<2",
  "hypothesis>=6.100,<7",
]

[project.scripts]
nanoscope = "nanoscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nanoscope"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU",
  "network: requires network access",
  "cloud: requires HF and W&B credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]  # sample sources for the graph parser, formatted on purpose

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
