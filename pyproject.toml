[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nanoscope-lab"
dynamic = ["version"]
description = "See what your language model learns"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "almajd3713" }]
keywords = ["language-models", "transformers", "pytorch", "education", "research", "interpretability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=3.0,<5",
  "huggingface-hub>=0.27,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "tiktoken>=0.8,<1",
  "tokenizers>=0.20,<1",
  "tomli>=2 ; python_full_version < '3.11'",
  "tomli-w>=1.0",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19,<1"]
graph = ["libcst>=1.1,<2"]  # emit graph edits back into source; part of `server`
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "watchfiles>=0.24,<2",
  "libcst>=1.1,<2",
  "ruff>=0.9,<1",  # the lint endpoint runs the ruff binary
]
dev = [
  "nbformat>=5.10,<6",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pyright>=1.1.390",
  "ruff>=0.9,<1",
  "jsonschema>=4.20,<5",
  "libcst>=1.1,<2",
  "hypothesis>=6.100,<7",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/almajd3713/nanoscope"
Source = "https://github.com/almajd3713/nanoscope"
Issues = "https://github.com/almajd3713/nanoscope/issues"

[project.scripts]
nanoscope = "nanoscope.cli:main"

[tool.hatch.version]
path = "nanoscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["nanoscope"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA GPU",
  "network: requires network access",
  "cloud: requires HF and W&B credentials",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "nanoscope/curricula"]  # sample sources, starters with TODOs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
exclude = ["nanoscope/curricula", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
