title = "QK-norm"
level = 1
summary = "Normalise queries and keys before the dot product so attention scores can't blow up."
prerequisites = ["modern-block/01-rmsnorm", "foundations/04-multi-head"]
unlocks = ["feature:qk_norm"]
forbid = ["torch.nn.MultiheadAttention", "F.scaled_dot_product_attention"]

[experiment]
kind = "check"

[[checks]]
id = "built"
kind = "defines"
class = "MyQKNormAttention"

[[checks]]
id = "same-as-reference"
kind = "equivalent"
class = "MyQKNormAttention"
reference = "naive_qk_norm_attention"
inputs = [[[2, 6, 16]], [[1, 3, 16]]]
call = [
  "input:0", "param:q.weight", "param:k.weight", "param:v.weight", "param:out.weight",
  "param:q_norm.weight", "param:k_norm.weight", 4,
]
randomize = true
tolerance = 1e-4

[[checks]]
id = "built-by-hand"
kind = "forbid"

[compute.cpu]
preset = "tinystories-5min"
estimate_minutes = 0.3
