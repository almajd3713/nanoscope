title = "Multi-head attention"
level = 0
summary = "Run several attention heads side by side, each on its own slice of the vector."
prerequisites = ["foundations/03-attention-head"]
unlocks = ["block:Attention"]
forbid = ["torch.nn.MultiheadAttention", "F.scaled_dot_product_attention"]

[experiment]
kind = "check"

[[checks]]
id = "built"
kind = "defines"
class = "MultiHead"

[[checks]]
id = "same-as-reference"
kind = "equivalent"
class = "MultiHead"
reference = "naive_multi_head_attention"
inputs = [[[2, 6, 16]], [[1, 3, 16]], [[3, 8, 16]]]
call = ["input:0", "param:q.weight", "param:k.weight", "param:v.weight", "param:out.weight", 4]
tolerance = 1e-5

[[checks]]
id = "built-by-hand"
kind = "forbid"

[depth.deep]
seeds = 1

[compute.cpu]
preset = "tinystories-5min"
estimate_minutes = 0.5
