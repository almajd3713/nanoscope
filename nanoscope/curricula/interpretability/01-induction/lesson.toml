title = "Induction heads over training"
level = 2
summary = "Feed a model a random sequence twice and measure how strongly each head looks back to the token that followed the earlier copy. Do it at every checkpoint to see when copying appears."
prerequisites = ["foundations/04-multi-head"]

[experiment]
kind = "check"

[[checks]]
id = "induction"
kind = "function"
name = "induction_score"
reference = "naive_induction_score"
tolerance = 1e-9
cases = [[[[1.0], [0.5, 0.5], [0.1, 0.2, 0.7], [0.0, 0.9, 0.05, 0.05]], 2], [[[1.0], [0.3, 0.7], [0.2, 0.2, 0.6], [0.1, 0.1, 0.1, 0.7], [0.0, 0.5, 0.25, 0.25, 0.0], [0.1, 0.1, 0.1, 0.1, 0.5, 0.1]], 3]]

[[checks]]
id = "previous"
kind = "function"
name = "previous_token_score"
reference = "naive_previous_token_score"
tolerance = 1e-9
cases = [[[[1.0], [0.4, 0.6], [0.1, 0.8, 0.1], [0.0, 0.1, 0.7, 0.2]]]]

[[checks]]
id = "emergence"
kind = "function"
name = "first_step_above"
reference = "naive_first_step_above"
tolerance = 0
cases = [[[0, 100, 200, 400, 800], [0.02, 0.05, 0.6, 0.7, 0.8], 0.5], [[0, 100, 200, 400], [0.02, 0.6, 0.3, 0.7], 0.5], [[0, 100, 200], [0.0, 0.1, 0.2], 0.5]]

[compute.cpu]
preset = "tinystories-5min"
estimate_minutes = 10

[compute.gpu]
preset = "fineweb-edu"
estimate_minutes = 120
